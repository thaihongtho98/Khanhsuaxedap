name: Deploy Web Game to GitHub Pages

on:
  # Tự động chạy khi push code lên branch main (hoặc master)
  push:
    branches:
      - main
      - master

  # Cho phép kích hoạt thủ công từ giao diện GitHub
  workflow_dispatch:

# Cấp quyền đọc/ghi nội dung và triển khai cho GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo chỉ có 1 tiến trình deploy chạy cùng một lúc
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Chỉ định đường dẫn chứa file index.html (thư mục gốc '.')
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
